apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: playground-service
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/ayoubbelhadj/IoT-abelhadj
    targetRevision: main
    path: dev
  destination:
    server: https://kubernetes.default.svc
    namespace: dev
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true
