apiVersion: v1
kind: Namespace
metadata:
  name: gitlab

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gitlab-data-pvc
  namespace: gitlab
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gitlab-config-pvc
  namespace: gitlab
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 512Mi

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gitlab-logs-pvc
  namespace: gitlab
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 512Mi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitlab-ce
  namespace: gitlab
  labels:
    app: gitlab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gitlab
  template:
    metadata:
      labels:
        app: gitlab
    spec:
      containers:
        - name: gitlab
          image: gitlab/gitlab-ce:latest
          ports:
            - containerPort: 80
              name: http
            - containerPort: 443
              name: https
            - containerPort: 22
              name: ssh
          env:
            - name: GITLAB_OMNIBUS_CONFIG
              value: |
                external_url 'http://gitlab-ce.gitlab.svc.cluster.local'
                gitlab_rails['initial_root_password'] = 'password42'
                prometheus_monitoring['enable'] = false
                alertmanager['enable'] = false
                node_exporter['enable'] = false
                redis_exporter['enable'] = false
                postgres_exporter['enable'] = false
                pgbouncer_exporter['enable'] = false
                gitlab_exporter['enable'] = false
                grafana['enable'] = false
                gitlab_kas['enable'] = false
                sentinel['enable'] = false
                gitlab_pages['enable'] = false
                registry['enable'] = false
                puma['worker_processes'] = 0
                puma['min_threads'] = 1
                puma['max_threads'] = 4
                puma['per_worker_max_memory_mb'] = 512
                sidekiq['max_concurrency'] = 2
                sidekiq['min_concurrency'] = 1
                postgresql['shared_buffers'] = "32MB"
                postgresql['max_worker_processes'] = 2
                postgresql['work_mem'] = "4MB"
                postgresql['maintenance_work_mem'] = "32MB"
                gitaly['ruby_max_rss'] = 100_000_000
                gitaly['concurrency'] = [{'rpc'=>'/gitaly.SmartHTTPService/PostReceivePack','max_per_repo'=>3}]
                gitlab_rails['env'] = {'MALLOC_CONF' => 'dirty_decay_ms:1000,muzzy_decay_ms:1000'}
                gitlab_rails['gitlab_shell_ssh_port'] = 22
          volumeMounts:
            - name: gitlab-data
              mountPath: /var/opt/gitlab
            - name: gitlab-config
              mountPath: /etc/gitlab
            - name: gitlab-logs
              mountPath: /var/log/gitlab
          resources:
            requests:
              memory: "1.5Gi"
              cpu: "250m"
            limits:
              memory: "3Gi"
              cpu: "2000m"
          # first boot is slow
          startupProbe:
            httpGet:
              path: /-/readiness
              port: 80
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 120
          readinessProbe:
            httpGet:
              path: /-/readiness
              port: 80
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 5
      volumes:
        - name: gitlab-data
          persistentVolumeClaim:
            claimName: gitlab-data-pvc
        - name: gitlab-config
          persistentVolumeClaim:
            claimName: gitlab-config-pvc
        - name: gitlab-logs
          persistentVolumeClaim:
            claimName: gitlab-logs-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: gitlab-ce
  namespace: gitlab
  labels:
    app: gitlab
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: 80
    - name: https
      port: 443
      targetPort: 443
    - name: ssh
      port: 22
      targetPort: 22
  selector:
    app: gitlab

---
apiVersion: v1
kind: Service
metadata:
  name: gitlab-nodeport
  namespace: gitlab
  labels:
    app: gitlab
spec:
  type: NodePort
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 30080
  selector:
    app: gitlab
